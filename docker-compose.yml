services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget_planner
    ports:
      - "5432:5432"
    volumes:
      - budget_planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  budget_planner_pgdata:
